<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | ResumeIQ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="dash-body">
  <div class="pt" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i></div>
  <div class="pt-logo" aria-hidden="true">ResumeIQ</div>

  <div class="dash">
    <aside class="side">
      <a class="logo" href="/" aria-label="ResumeIQ home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ffe45c"/><path d="M8 17.5l5.2 5L24.5 9" fill="none" stroke="#12151f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="logo-text">Resume<em>IQ</em></span>
      </a>

      <nav class="side-nav" aria-label="Dashboard">
        <button class="nav-btn active" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-btn" data-view="resume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>
          <span>My CV</span>
        </button>
        <button class="nav-btn" data-view="questions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.4"/></svg>
          <span>Interview questions</span><b class="badge" id="badge-q" hidden></b>
        </button>
        <button class="nav-btn" data-view="prep">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12zM9 20v-6h6v6M9 10h.01M15 10h.01"/></svg>
          <span>Company prep</span>
        </button>
        <button class="nav-btn" data-view="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L17 4l3 3L8 19zM14 7l3 3"/></svg>
          <span>CV review</span><b class="badge red" id="badge-r" hidden></b>
        </button>
      </nav>

      <div class="side-foot">
        <div class="user">
          <span class="avatar" id="u-avatar" aria-hidden="true"></span>
          <div class="user-text"><b id="u-name">&nbsp;</b><small id="u-email"></small></div>
        </div>
        <button class="btn btn-plain btn-block" id="logout"><span>Log out</span></button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="top">
        <div>
          <p class="hello" id="hello">&nbsp;</p>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="top-actions"><button class="btn" id="btn-another" hidden><span>Try another CV</span></button><button class="btn btn-plain mobile-only" id="logout-2"><span>Log out</span></button></div>
      </header>

      <section class="view active" id="view-overview" aria-live="polite"><div class="skeleton"></div><div class="skeleton short"></div></section>
      <section class="view" id="view-resume"></section>
      <section class="view" id="view-questions"></section>
      <section class="view" id="view-prep"></section>
      <section class="view" id="view-review"></section>
    </main>
  </div>

  <!-- analysis in progress -->
  <div class="analyzing" id="analyzing" hidden role="dialog" aria-modal="true" aria-labelledby="an-title">
    <div class="an-card">
      <div class="an-paper" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>
      <h2 id="an-title">Reading your CV</h2>
      <p class="an-sub">This can take up to a minute. Keep this tab open.</p>
      <ol class="an-steps" id="an-steps"></ol>
    </div>
  </div>

  <!-- delete confirmation -->
  <div class="modal" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <div class="modal-card">
      <h2 id="cf-title">Delete your saved CV?</h2>
      <p>Your questions, issues and scores will be removed. You can upload a CV again at any time.</p>
      <div class="modal-actions">
        <button class="btn" id="cf-cancel"><span>Keep it</span></button>
        <button class="btn btn-danger" id="cf-ok"><span>Delete CV</span></button>
      </div>
    </div>
  </div>

  <!-- shared gradient-free ring helper lives in JS; nothing to define here -->
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
